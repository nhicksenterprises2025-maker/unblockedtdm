appId: com.skirmisharena.launcher
productName: Skirmish Arena Launcher
electronVersion: 38.0.0
asar: true
files:
  - src/**/*
extraResources:
  - from: ../dist-game/SkirmishArena.exe
    to: game/SkirmishArena.exe
win:
  target:
    - nsis
  executableName: Skirmish Arena Launcher
artifactName: SkirmishArena-Setup.exe
directories:
  output: ../dist-launcher
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Skirmish Arena
  uninstallDisplayName: Skirmish Arena
  deleteAppDataOnUninstall: false
