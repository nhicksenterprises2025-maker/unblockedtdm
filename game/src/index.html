<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UnblockedTDM</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <header class="build-hud">
    <div class="brand"><span class="mark">UT</span><div><strong>UNBLOCKEDTDM</strong><small id="buildLabel">BUILD 1.00 · VERSION 2</small></div></div>
    <div class="map-meta"><strong id="mapLabel">TRAINING COMPLEX</strong><small id="phaseLabel">World / Engine</small></div>
  </header>
  <aside class="diagnostics">
    <div><span>WORLD EXPLORER</span><strong>WASD / ARROWS</strong></div>
    <div><span>POSITION</span><strong id="coords">Tile —, —</strong></div>
    <div><span>CAMERA</span><strong id="camera">—</strong></div>
    <div><span>F1</span><strong id="debugState">COLLISION OFF</strong></div>
    <div><span>F11</span><strong>FULLSCREEN</strong></div>
  </aside>
  <footer class="engine-footer"><span id="fps">— FPS</span><span>64PX TILE GRID</span><span>CANVAS 2D</span></footer>
  <section id="pausePanel" class="pause-panel"><div><p>UNBLOCKEDTDM</p><h1>PAUSED</h1><span>Press ESC to return to the world</span></div></section>
  <script type="module" src="renderer.js"></script>
</body>
</html>
