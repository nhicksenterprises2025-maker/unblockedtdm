<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 270" role="img" aria-labelledby="title description" data-brand-system="sa-command-mark-v2">
  <title id="title">Skirmish Arena</title>
  <desc id="description">The shared Skirmish Arena command emblem beside a crisp steel and cyan tactical wordmark.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f8f9"/>
      <stop offset=".36" stop-color="#c9d1d5"/>
      <stop offset=".53" stop-color="#6d7981"/>
      <stop offset=".6" stop-color="#e6ecee"/>
      <stop offset="1" stop-color="#89959c"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#168fb8"/>
      <stop offset=".5" stop-color="#55d1ed"/>
      <stop offset="1" stop-color="#168fb8"/>
    </linearGradient>
    <linearGradient id="emblemSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f6f7"/>
      <stop offset=".42" stop-color="#a7b2b8"/>
      <stop offset="1" stop-color="#66737b"/>
    </linearGradient>
    <linearGradient id="emblemDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17242c"/>
      <stop offset="1" stop-color="#050b0f"/>
    </linearGradient>
    <filter id="shadow" x="-6%" y="-12%" width="112%" height="132%">
      <feDropShadow dx="0" dy="7" stdDeviation="4" flood-color="#000509" flood-opacity=".68"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- The crest and wordmark are deliberately separated for edge clarity. -->
    <!-- Keep the exact command-emblem geometry inline: Chromium intentionally
         blocks nested external SVG resources when this file itself is loaded
         through an <img>, which otherwise leaves a blank crest in Electron. -->
    <g transform="translate(24 25) scale(1.222222)" data-brand-system="sa-command-mark-v2" data-brand-source="skirmish-arena-emblem.svg">
      <path d="M90 7 163 47v83l-73 43-73-43V47Z" fill="#03080b" stroke="#293942" stroke-width="8"/>
      <path d="M90 14 156 51v75l-66 39-66-39V51Z" fill="url(#emblemDark)" stroke="url(#emblemSteel)" stroke-width="4"/>
      <path d="M90 27 144 57v62l-54 32-54-32V57Z" fill="#071117" stroke="#3dc4e8" stroke-width="3"/>
      <path data-monogram-letter="s" d="M49 54h53l-7 15H66l-7 7 7 7h25l12 13-8 16-11 9H43l7-15h29l7-7-7-7H57L43 78Z" fill="url(#emblemSteel)"/>
      <path data-monogram-letter="a" d="m88 127 24-76h15l24 76h-17l-6-20h-23l-6 20Zm21-34h15l-7-24Z" fill="#48c8eb"/>
      <path d="M53 135h74" stroke="#70818a" stroke-width="2"/>
    </g>

    <g aria-hidden="true">
      <path d="M282 48h623l27 17H282Z" fill="#071016" stroke="#374952" stroke-width="3"/>
      <path d="M302 61h594" stroke="url(#cyan)" stroke-width="4"/>
      <path d="M282 166h650l-27 17H282Z" fill="#071016" stroke="#374952" stroke-width="3"/>
      <path d="M302 168h594" stroke="url(#cyan)" stroke-width="3"/>
      <path d="M282 224h403l18 18H282Z" fill="#071016" stroke="#3b4d56" stroke-width="3"/>
      <path d="M302 225h376" stroke="#2bbde2" stroke-width="3"/>
    </g>

    <text x="290" y="38" fill="#75ddf4" font-family="Consolas, 'Cascadia Mono', monospace" font-size="16" font-weight="800" letter-spacing="5">3V3 TACTICAL ARENA</text>
    <text x="282" y="151" fill="url(#steel)" stroke="#050b0f" stroke-width="8" paint-order="stroke fill" font-family="Arial Black, Impact, sans-serif" font-size="102" font-weight="900" letter-spacing="-3">SKIRMISH</text>
    <text x="292" y="216" fill="#d7e0e4" font-family="Arial Black, Impact, sans-serif" font-size="45" font-weight="900" letter-spacing="19">ARENA</text>
  </g>
</svg>
