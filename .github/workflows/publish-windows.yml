name: Build and Publish Skirmish Arena

on:
  push:
    branches: [main]
    paths:
      - release-plan.json
      - launcher-release-plan.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: unblockedtdm-release
  cancel-in-progress: false

jobs:
  detect-release-type:
    runs-on: ubuntu-latest
    outputs:
      game: ${{ steps.detect.outputs.game }}
      launcher: ${{ steps.detect.outputs.launcher }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed release plan
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "game=true" >> "$GITHUB_OUTPUT"
            echo "launcher=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          if printf '%s\n' "$files" | grep -Fxq 'release-plan.json'; then
            echo "game=true" >> "$GITHUB_OUTPUT"
          else
            echo "game=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$files" | grep -Fxq 'launcher-release-plan.json'; then
            echo "launcher=true" >> "$GITHUB_OUTPUT"
          else
            echo "launcher=false" >> "$GITHUB_OUTPUT"
          fi

  windows-release:
    needs: detect-release-type
    if: ${{ needs.detect-release-type.outputs.game == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        shell: pwsh
        run: |
          "install" | Set-Content release-failure-stage.txt
          npm install --no-audit --no-fund 2>&1 | Tee-Object -FilePath install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Synchronize build metadata
        shell: pwsh
        run: |
          "sync-build" | Set-Content release-failure-stage.txt
          npm run sync:build 2>&1 | Tee-Object -FilePath sync-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate JavaScript
        shell: pwsh
        run: |
          "validate" | Set-Content release-failure-stage.txt
          npm run check 2>&1 | Tee-Object -FilePath validate.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build game and launcher
        shell: pwsh
        run: |
          "build-windows" | Set-Content release-failure-stage.txt
          npm run build:windows 2>&1 | Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare immutable release assets
        shell: pwsh
        run: |
          "prepare-assets" | Set-Content release-failure-stage.txt
          $plan = Get-Content release-plan.json | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $gameAsset = "UnblockedTDM-$($plan.gameVersion)-v$($plan.build).exe"
          $installerAsset = "SkirmishArena-Setup-$($plan.gameVersion)-v$($plan.build).exe"
          Copy-Item "dist-game/UnblockedTDM.exe" "dist-release/$gameAsset" -Force
          Copy-Item "dist-launcher/SkirmishArena-Setup.exe" "dist-release/$installerAsset" -Force
          node scripts/finalize-release.mjs

      - name: Publish or repair GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "publish-release" | Set-Content release-failure-stage.txt
          $plan = Get-Content release-plan.json | ConvertFrom-Json
          $tag = $plan.tag
          $gameAsset = "dist-release/UnblockedTDM-$($plan.gameVersion)-v$($plan.build).exe"
          $installerAsset = "dist-release/SkirmishArena-Setup-$($plan.gameVersion)-v$($plan.build).exe"
          $manifestAsset = "dist-release/release-manifest.json"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $gameAsset $installerAsset $manifestAsset --clobber
          } else {
            gh release create $tag $gameAsset $installerAsset $manifestAsset --target $env:GITHUB_SHA --title $plan.title --notes-file $plan.notesFile
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish live update manifests
        shell: pwsh
        run: |
          "publish-manifests" | Set-Content release-failure-stage.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/latest.json distribution/versions.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $plan = Get-Content release-plan.json | ConvertFrom-Json
            git commit -m "Publish $($plan.title) distribution manifests [skip ci]"
            git reset --hard HEAD
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload CI copy of Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: Skirmish-Arena-Windows
          path: dist-release/*
          if-no-files-found: error

      - name: Persist release failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $stage = if (Test-Path release-failure-stage.txt) { Get-Content release-failure-stage.txt -Raw } else { "unknown" }
          $lines = @(
            "Skirmish Arena release failure diagnostic",
            "runId=$env:GITHUB_RUN_ID",
            "sha=$env:GITHUB_SHA",
            "stage=$($stage.Trim())",
            "timestamp=$([DateTime]::UtcNow.ToString('o'))",
            ""
          )
          foreach ($log in @('install.log','sync-build.log','validate.log','build-windows.log')) {
            if (Test-Path $log) {
              $lines += "===== $log ====="
              $lines += Get-Content $log
              $lines += ""
            }
          }
          $lines | Set-Content distribution/last-release-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/last-release-failure.txt
          git commit -m "Record release failure diagnostic [skip ci]" || exit 0
          git reset --hard HEAD
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main

  launcher-release:
    needs: detect-release-type
    if: ${{ needs.detect-release-type.outputs.launcher == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        shell: pwsh
        run: |
          "install" | Set-Content launcher-failure-stage.txt
          npm install --no-audit --no-fund 2>&1 | Tee-Object -FilePath launcher-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate launcher
        shell: pwsh
        run: |
          "validate" | Set-Content launcher-failure-stage.txt
          node --check launcher/src/boot.js
          node --check launcher/src/main.js
          node --check launcher/src/preload.js
          node --check launcher/src/renderer.js
          node scripts/test-launcher-rebrand.mjs 2>&1 | Tee-Object -FilePath launcher-validate.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore immutable bootstrap game
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "game-bundle" | Set-Content launcher-failure-stage.txt
          $plan = Get-Content launcher-release-plan.json | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path dist-game | Out-Null
          New-Item -ItemType Directory -Force -Path dist-game-source | Out-Null
          gh release download $plan.gameTag --pattern $plan.gameAsset --dir dist-game-source --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "dist-game-source/$($plan.gameAsset)" "dist-game/UnblockedTDM.exe" -Force

          $buildInfo = [ordered]@{
            product = 'Skirmish Arena'
            gameVersion = $plan.gameVersion
            build = $plan.gameBuild
            sequence = $plan.gameSequence
            phase = $plan.gamePhase
            tag = $plan.gameTag
            title = $plan.gameTitle
            repository = 'nhicksenterprises2025-maker/unblockedtdm'
          }
          $buildInfo | ConvertTo-Json | Set-Content launcher/src/build-info.json

      - name: Build Skirmish Arena Launcher
        shell: pwsh
        run: |
          "build-launcher" | Set-Content launcher-failure-stage.txt
          npm run build:launcher 2>&1 | Tee-Object -FilePath launcher-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare branded installer
        shell: pwsh
        run: |
          "prepare-installer" | Set-Content launcher-failure-stage.txt
          $plan = Get-Content launcher-release-plan.json | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $asset = "SkirmishArena-Setup-$($plan.launcherVersion).exe"
          Copy-Item "dist-launcher/SkirmishArena-Setup.exe" "dist-release/$asset" -Force

      - name: Publish launcher release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "publish-launcher" | Set-Content launcher-failure-stage.txt
          $plan = Get-Content launcher-release-plan.json | ConvertFrom-Json
          $asset = "dist-release/SkirmishArena-Setup-$($plan.launcherVersion).exe"
          gh release view $plan.tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $plan.tag $asset --clobber
          } else {
            gh release create $plan.tag $asset --target $env:GITHUB_SHA --title $plan.title --notes-file $plan.notesFile
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish launcher manifest
        shell: pwsh
        run: |
          "publish-launcher-manifest" | Set-Content launcher-failure-stage.txt
          $plan = Get-Content launcher-release-plan.json | ConvertFrom-Json
          $installer = "dist-release/SkirmishArena-Setup-$($plan.launcherVersion).exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          $launcherManifest = [ordered]@{
            product = 'Skirmish Arena Launcher'
            launcherVersion = $plan.launcherVersion
            tag = $plan.tag
            title = $plan.title
            installerUrl = "https://github.com/nhicksenterprises2025-maker/unblockedtdm/releases/download/$($plan.tag)/SkirmishArena-Setup-$($plan.launcherVersion).exe"
            sha256 = $hash
            publishedAt = [DateTime]::UtcNow.ToString('o')
          }
          $launcherManifest | ConvertTo-Json | Set-Content distribution/launcher-latest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/launcher-latest.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish Skirmish Arena Launcher $($plan.launcherVersion) [skip ci]"
            git reset --hard HEAD
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload launcher installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Skirmish-Arena-Launcher
          path: dist-release/SkirmishArena-Setup-*.exe
          if-no-files-found: error

      - name: Persist launcher failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $stage = if (Test-Path launcher-failure-stage.txt) { Get-Content launcher-failure-stage.txt -Raw } else { "unknown" }
          $lines = @(
            "Skirmish Arena launcher release failure diagnostic",
            "runId=$env:GITHUB_RUN_ID",
            "sha=$env:GITHUB_SHA",
            "stage=$($stage.Trim())",
            "timestamp=$([DateTime]::UtcNow.ToString('o'))",
            ""
          )
          foreach ($log in @('launcher-install.log','launcher-validate.log','launcher-build.log')) {
            if (Test-Path $log) {
              $lines += "===== $log ====="
              $lines += Get-Content $log
              $lines += ""
            }
          }
          $lines | Set-Content distribution/last-launcher-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/last-launcher-failure.txt
          git commit -m "Record launcher release failure [skip ci]" || exit 0
          git reset --hard HEAD
          git pull --rebase origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:main
