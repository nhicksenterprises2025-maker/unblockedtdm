name: Build and Publish Skirmish Arena

on:
  push:
    branches: [main]
    paths:
      - release-plan.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skirmish-arena-release
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Synchronize build metadata
        run: npm run sync:build

      - name: Validate JavaScript and regression suite
        run: npm run check

      - name: Build game and launcher
        run: npm run build:windows

      - name: Prepare immutable release assets
        shell: pwsh
        run: |
          $plan = Get-Content release-plan.json | ConvertFrom-Json
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $gameAsset = "SkirmishArena-$($plan.gameVersion)-v$($plan.build).exe"
          $installerAsset = "SkirmishArena-Setup-$($plan.gameVersion)-v$($plan.build).exe"
          Copy-Item "dist-game/SkirmishArena.exe" "dist-release/$gameAsset" -Force
          Copy-Item "dist-launcher/SkirmishArena-Setup.exe" "dist-release/$installerAsset" -Force
          node scripts/finalize-release.mjs

      - name: Publish or repair GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $plan = Get-Content release-plan.json | ConvertFrom-Json
          $tag = $plan.tag
          $gameAsset = "dist-release/SkirmishArena-$($plan.gameVersion)-v$($plan.build).exe"
          $installerAsset = "dist-release/SkirmishArena-Setup-$($plan.gameVersion)-v$($plan.build).exe"
          $manifestAsset = "dist-release/release-manifest.json"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $gameAsset $installerAsset $manifestAsset --clobber
          } else {
            gh release create $tag $gameAsset $installerAsset $manifestAsset --target $env:GITHUB_SHA --title $plan.title --notes-file $plan.notesFile
          }

      - name: Publish live update manifests
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add distribution/latest.json distribution/versions.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $plan = Get-Content release-plan.json | ConvertFrom-Json
            git commit -m "Publish $($plan.title) distribution manifests [skip ci]"
            git push origin HEAD:main
          }

      - name: Upload CI copy of Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: SkirmishArena-Windows
          path: dist-release/*
          if-no-files-found: error
