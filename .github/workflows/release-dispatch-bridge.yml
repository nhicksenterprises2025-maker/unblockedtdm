name: Release Dispatch Bridge

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      - release-plan.json

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical Windows release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-windows.yml --ref main
