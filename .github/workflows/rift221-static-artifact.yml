name: Build RIFT RUN 2.2.1 static artifact

on:
  push:
    branches: [rift-run-ios]
    paths:
      - '.github/workflows/rift221-static-artifact.yml'
      - 'rift221desktop/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rift-run-ios
          fetch-depth: 0

      - name: Reconstruct exact 2.2.1 desktop static snapshot
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib'),crypto=require('crypto');
          let b64='';
          for(let i=0;i<5;i++) b64+=fs.readFileSync(`rift221desktop/p${i}.txt`,'utf8').trim();
          const br=Buffer.from(b64,'base64');
          const html=zlib.brotliDecompressSync(br);
          const sha=crypto.createHash('sha256').update(html).digest('hex');
          console.log('brotli bytes',br.length,'html bytes',html.length,'sha256',sha);
          if(html.length!==97087) throw new Error(`size mismatch: ${html.length}`);
          if(sha!=='f5eb1f8d5c0df43311e5e6f6b2b6d5a11af3af5e47d0fb07cb0bf403875bc2a5') throw new Error(`sha mismatch: ${sha}`);
          const s=html.toString('utf8');
          for(const marker of [
            'UPDATE 2.2.1 · CONTRACTS',
            'DESKTOP COMBAT',
            'CONTROLS — TOUCH + DESKTOP',
            'WASD / ARROWS MOVE · MOUSE AIM PRIORITY · SPACE DASH · E OVERDRIVE',
            'mouseAim',
            'syncKeys'
          ]) if(!s.includes(marker)) throw new Error(`missing marker: ${marker}`);
          if(s.includes('fetch(')) throw new Error('runtime fetch found in final game source');
          fs.mkdirSync('rift221',{recursive:true});
          fs.writeFileSync('rift221/index.html',html);
          NODE

      - name: Commit verified static artifact
        shell: bash
        run: |
          git config user.name 'rift-run-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rift221/index.html
          git diff --cached --quiet || git commit -m 'RIFT RUN 2.2.1 desktop verified static artifact'
          git push origin HEAD:rift-run-ios
