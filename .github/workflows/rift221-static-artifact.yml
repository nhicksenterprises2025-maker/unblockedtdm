name: Build RIFT RUN 2.2.1 PC mobile static artifact

on:
  push:
    branches: [rift-run-ios]
    paths:
      - '.github/workflows/rift221-static-artifact.yml'
      - 'rift221snapshot/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rift-run-ios
          fetch-depth: 0

      - name: Reconstruct exact 2.2.1 PC mobile game
        shell: bash
        run: |
          cat rift221snapshot/p0.txt rift221snapshot/p1.txt rift221snapshot/p2.txt rift221snapshot/p3.txt rift221snapshot/p4.txt rift221snapshot/p5.txt rift221snapshot/p6.txt | base64 -d | gzip -d > /tmp/index.html
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('/tmp/index.html')
          b=p.read_bytes()
          sha=hashlib.sha256(b).hexdigest()
          print('bytes',len(b),'sha256',sha)
          assert len(b)==104215, len(b)
          assert sha=='3ee6c9a25af0ac9acbfaac4d91dfd78cc493addc99b8ea1d66373b9600717de6', sha
          s=b.decode('utf-8')
          for marker in ('UPDATE 2.2.1 · CONTRACTS','pauseDesktop','fullscreenDesktop','aimTarget'):
              assert marker in s, marker
          m=re.search(r'<script>(.*)</script>',s,re.S)
          assert m, 'script block missing'
          Path('/tmp/game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/game.js
          mkdir -p rift221
          cp /tmp/index.html rift221/index.html

      - name: Commit verified static artifact
        shell: bash
        run: |
          git config user.name 'rift-run-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rift221/index.html
          git diff --cached --quiet || git commit -m 'RIFT RUN 2.2.1 PC mobile static artifact'
          git push origin HEAD:rift-run-ios
