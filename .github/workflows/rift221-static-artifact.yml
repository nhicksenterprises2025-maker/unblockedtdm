name: Build RIFT RUN 2.2.1 static artifact

on:
  push:
    branches: [rift-run-ios]
    paths:
      - '.github/workflows/rift221-static-artifact.yml'
      - 'rift221build/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rift-run-ios
          fetch-depth: 0

      - name: Build exact 2.2.1 static snapshot
        shell: bash
        run: |
          rm -rf dist
          node rift221build/build.js
          test -f dist/index.html
          bytes=$(wc -c < dist/index.html)
          sha=$(sha256sum dist/index.html | awk '{print $1}')
          echo "bytes=$bytes sha256=$sha"
          test "$bytes" = "94593"
          test "$sha" = "f034e94ca2ef737d649c3b8df05c7d680946598edcaaaa0a3e37c7d56cd8ca0a"
          grep -q 'UPDATE 2.2.1 · CONTRACTS' dist/index.html
          mkdir -p rift221
          cp dist/index.html rift221/index.html

      - name: Commit verified static artifact
        shell: bash
        run: |
          git config user.name 'rift-run-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rift221/index.html
          git diff --cached --quiet || git commit -m 'RIFT RUN 2.2.1 verified static artifact'
          git push origin HEAD:rift-run-ios
