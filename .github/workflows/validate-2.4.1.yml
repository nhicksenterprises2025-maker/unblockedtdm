name: Validate Skirmish Arena 2.4.1

on:
  push:
    branches: [dev/2.4.1-combat-polish]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run syntax and regression gates
        run: npm run check
